name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The default token can only read the repo. This workflow uses no secrets.
permissions:
  contents: read

# A new push to a PR replaces its running checks. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site-build:
    name: site-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the chat widget
        run: node --test "rag/docusaurus-plugin/**/*.test.js"

      - name: Build the site
        run: npm run build

      # The rag-eval job in Step 11 checks citation links against this build.
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: build/
          if-no-files-found: error
          retention-days: 7

  rag-test:
    name: rag-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest
